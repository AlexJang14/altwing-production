name: AltWing Launch browser acceptance (isolated QA)

on:
  push:
    branches: [qa/launch-browser-20261124-de87a266]
    paths: [qa/READY.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altwing-isolated-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-acceptance:
    if: github.ref == 'refs/heads/qa/launch-browser-20261124-de87a266'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qa/AltWing-Browser-QA/package-lock.json
      - name: Verify exact frozen source and browser inputs
        run: node qa/verify-inputs.mjs
      - name: Install isolated testing dependencies
        run: npm ci --prefix qa/AltWing-Browser-QA --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Firefox
        run: node qa/AltWing-Browser-QA/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Execute actual browser acceptance cases
        id: browser
        shell: bash
        run: |
          set +e
          node qa/runner-ci.mjs 2>&1 | tee qa/browser-run.log
          result=${PIPESTATUS[0]}
          echo "runner_exit=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Generate HTML report and Actions summary
        if: always()
        run: node qa/report.mjs
      - name: Upload actual reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AltWing-Launch-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Enforce observed automated results
        if: always()
        run: node qa/report.mjs --enforce
