name: AltWing guidance freshness

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  verify-guidance-data:
    if: vars.ALTWING_CONTENT_AUTOMATION_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-guidance-freshness.mjs
