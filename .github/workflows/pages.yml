name: Test and deploy AltWing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/domain-migration.yml

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      target: ${{ steps.build.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read configured Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and check the configured deployment base
        id: build
        env:
          ALTWING_CONFIGURED_BASE: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build-configured-pages.mjs
      - name: Upload static frontend only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.directory }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
